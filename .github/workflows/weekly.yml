name: BIP Watcher Daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full_reset:
        description: "FULL RESET — wyczyść cały cache-store i zacznij od zera"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# [FIX] concurrency tylko dla jobów scan — NIE dla merge.
concurrency:
  group: bip-watcher-scans-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:

  init_cache_store:
    name: Init cache-store branch
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create cache-store branch if missing
        shell: bash
        run: |
          set -e
          git fetch origin +refs/heads/cache-store:refs/remotes/origin/cache-store 2>/dev/null || true

          if git show-ref --verify --quiet refs/remotes/origin/cache-store; then
            echo "✅ cache-store exists"
            exit 0
          fi

          echo "ℹ️ Creating cache-store orphan branch"
          git checkout --orphan cache-store
          rm -rf ./* ./.gitignore || true
          mkdir -p shards master
          echo "cache-store initialized $(date -u)" > README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md shards master
          git commit -m "Initialize cache-store [skip ci]"
          git push origin cache-store

  reset_cache_store:
    name: FULL RESET cache-store
    runs-on: ubuntu-latest
    timeout-minutes: 320
    needs: [init_cache_store]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_reset == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cache-store
          fetch-depth: 1

      - name: Wipe all shards and master
        shell: bash
        run: |
          set -e
          rm -rf shards master
          mkdir -p shards master
          echo "FULL RESET @ $(date -u +%F_%T) UTC" > README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "FULL RESET cache-store [skip ci]" || echo "Nothing to commit"

          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push retry #$i"
            sleep $((i*2))
          done
          echo "✅ cache-store wyczyszczony"

  setup:
    name: Build shard matrix
    runs-on: ubuntu-latest
    timeout-minutes: 320
    needs: [init_cache_store]
    if: needs.init_cache_store.result == 'success'
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      total: ${{ steps.build.outputs.total }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Count gminy and build matrix
        id: build
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, os
          from pathlib import Path

          for candidate in ["data/bipy1.csv", "bipy1.csv"]:
              csv_file = Path(candidate)
              if csv_file.exists():
                  break
          else:
              print("❌ Nie znaleziono bipy1.csv!")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write('matrix={"shard":[]}\n')
                  f.write("total=0\n")
              exit(0)

          rows = []
          with open(csv_file, encoding="utf-8") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  name = (row.get("name") or "").strip()
                  url  = (row.get("url") or "").strip()
                  if name and url:
                      rows.append((name, url))

          total = len(rows)
          matrix = json.dumps({"shard": list(range(total))})

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
              f.write(f"total={total}\n")

          print(f"✅ Gmin: {total}, indeksy: 0..{total-1}")
          PY

  scan:
    name: Scan shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 340
    needs: [setup]
    if: needs.setup.result == 'success' && needs.setup.outputs.total != '0'

    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: cache-store
          path: cache-store
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system dependencies for Playwright
        run: |
          playwright install-deps

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Restore shard cache from cache-store
        shell: bash
        env:
          SHARD_INDEX: "${{ matrix.shard }}"
        run: |
          set -e
          mkdir -p data

          SHARD_GZ="cache-store/shards/cache_shard_${SHARD_INDEX}.json.gz"

          if [ -f "$SHARD_GZ" ]; then
            echo "📦 Wczytuję shard $SHARD_INDEX z poprzedniego runu..."
            gunzip -c "$SHARD_GZ" > "data/cache_shard_${SHARD_INDEX}.json"
            cp "data/cache_shard_${SHARD_INDEX}.json" data/cache.json
            python3 -c "
          import json
          with open('data/cache.json') as f:
              c = json.load(f)
          urls  = len(c.get('urls_seen', {}))
          cont  = len(c.get('content_seen', {}))
          seeds = len(c.get('gmina_seeds', {}))
          front = len(c.get('gmina_frontiers', {}))
          dead  = sum(len(v) for v in c.get('dead_urls', {}).values())
          print(f'📦 Cache restored: {urls} URLs, {cont} content, {seeds} seeds, {front} frontiers, {dead} dead')
          front_data = c.get('gmina_frontiers', {})
          for k, v in list(front_data.items())[:3]:
              print(f'  🗺️  frontier {k[:16]}: {len(v)} URL')
          "
          else
            echo "ℹ️ Brak poprzedniego sharda $SHARD_INDEX — startujemy świeżo"
            echo '{"schema":14,"urls_seen":{},"content_seen":{},"gmina_seeds":{},"gmina_frontiers":{},"gmina_retry":{},"dead_urls":{}}' > data/cache.json
          fi

      - name: Run watcher
        continue-on-error: true
        timeout-minutes: 300
        env:
          PYTHONUNBUFFERED: "1"
          SHARD_TOTAL: ${{ needs.setup.outputs.total }}
          SHARD_INDEX: "${{ matrix.shard }}"
          RUN_DEADLINE_MIN: "300"
          CONCURRENT_GMINY: "1"
          CONCURRENT_REQUESTS: "100"
          LIMIT_PER_HOST: "12"
          RATE_MIN_DELAY: "0.3"
          CHECKPOINT_EVERY_SEC: "300"
          RESET_CACHE: ${{ github.event.inputs.full_reset || 'false' }}
        shell: bash
        run: |
          python bip_watcher.py

      - name: Compress and commit shard to cache-store
        if: always()
        timeout-minutes: 12
        shell: bash
        env:
          SHARD_INDEX: "${{ matrix.shard }}"
        run: |
          set -e

          SHARD_JSON="data/cache_shard_${SHARD_INDEX}.json"

          if [ ! -f "$SHARD_JSON" ]; then
            echo "ℹ️ Brak $SHARD_JSON — nic do zapisania"
            exit 0
          fi

          mkdir -p cache-store/shards
          gzip -9 -c "$SHARD_JSON" > "cache-store/shards/cache_shard_${SHARD_INDEX}.json.gz"
          SIZE=$(du -h "cache-store/shards/cache_shard_${SHARD_INDEX}.json.gz" | cut -f1)
          echo "✅ Shard $SHARD_INDEX skompresowany: $SIZE"

          cd cache-store

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COMMITTED=0
          for i in $(seq 1 20); do
            echo "--- Próba $i/20 dla sharda $SHARD_INDEX ---"

            git fetch origin cache-store 2>/dev/null || true
            git reset --hard origin/cache-store
            mkdir -p shards

            gzip -9 -c "../${SHARD_JSON}" > "shards/cache_shard_${SHARD_INDEX}.json.gz"

            # [FIX] Commituj hits_backup razem z shardem — prawdziwy backup
            [ -f "../data/hits_backup.jsonl" ] && cp "../data/hits_backup.jsonl" "hits_backup_${SHARD_INDEX}.jsonl" || true

            git add "shards/cache_shard_${SHARD_INDEX}.json.gz"
            git add "hits_backup_${SHARD_INDEX}.jsonl" 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "ℹ️ Shard $SHARD_INDEX — bez zmian, commit pominięty"
              COMMITTED=1
              break
            fi

            git commit -m "Update shard ${SHARD_INDEX} [skip ci]"

            if git push origin cache-store 2>/dev/null; then
              echo "✅ Push sharda $SHARD_INDEX OK (próba $i)"
              COMMITTED=1
              break
            fi

            echo "⚠️ Push retry #$i — cofam i próbuję ponownie..."
            git reset HEAD~1
            sleep $(( (RANDOM % 15) + i * 2 + SHARD_INDEX % 7 ))
          done

          if [ "$COMMITTED" -eq 0 ]; then
            echo "❌ Nie udało się zapisać sharda $SHARD_INDEX po 20 próbach!"
            exit 1
          fi

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bip-shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/summary_report.txt
            data/log.csv
            data/diag_gminy.csv
            data/diag_errors.csv

  merge:
    name: Merge + email
    runs-on: ubuntu-latest
    needs: [scan]
    if: always()
    timeout-minutes: 30
    concurrency:
      group: bip-watcher-merge
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: cache-store
          path: cache-store
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge shards into master cache.json + cache.zip
        shell: bash
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, glob, gzip, zipfile
          from pathlib import Path

          SHARDS = Path("cache-store/shards")
          DATA   = Path("data")

          REQUIRED = ["schema","urls_seen","content_seen","gmina_seeds",
                      "gmina_frontiers","gmina_retry","dead_urls"]

          merged = {k: ({} if k != "schema" else 14) for k in REQUIRED}

          shard_files = sorted(glob.glob(str(SHARDS / "cache_shard_*.json.gz")))
          print(f"Mergowanie {len(shard_files)} shardów...")

          for sf in shard_files:
              try:
                  with gzip.open(sf, "rt", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"⚠️ Błąd {sf}: {e}")
                  continue

              for k in REQUIRED:
                  if k == "schema" or k not in data:
                      continue
                  if isinstance(merged[k], dict) and isinstance(data[k], dict):
                      if k == "urls_seen":
                          for h, ts in data[k].items():
                              if (ts or "") >= (merged[k].get(h, "")):
                                  merged[k][h] = ts
                      elif k == "dead_urls":
                          for gkey, urls in data[k].items():
                              merged[k].setdefault(gkey, [])
                              seen = set(merged[k][gkey])
                              for u in urls:
                                  if u not in seen:
                                      merged[k][gkey].append(u)
                                      seen.add(u)
                      else:
                          merged[k].update(data[k])
                  else:
                      merged[k] = data[k]

          DATA.mkdir(parents=True, exist_ok=True)
          (DATA / "cache.json").write_text(
              json.dumps(merged, ensure_ascii=False, indent=2), encoding="utf-8")

          with zipfile.ZipFile(DATA / "cache.zip", "w",
                               compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.write(DATA / "cache.json", arcname="cache.json")

          urls_n  = len(merged.get("urls_seen", {}))
          cont_n  = len(merged.get("content_seen", {}))
          seeds_n = len(merged.get("gmina_seeds", {}))
          front_n = len(merged.get("gmina_frontiers", {}))
          dead_n  = sum(len(v) for v in merged.get("dead_urls", {}).values())
          print(f"✅ Merge: {urls_n} URLs, {cont_n} content, {seeds_n} seeds, {front_n} frontiers, {dead_n} dead")
          PY

      - name: Split + commit master cache
        if: always()
        shell: bash
        run: |
          mkdir -p cache-store/master
          rm -f cache-store/master/cache.zip.part-* || true
          split -b 95m data/cache.zip cache-store/master/cache.zip.part-

          cd cache-store
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add master/cache.zip.part-*
          if git diff --cached --quiet; then
            echo "ℹ️ Master cache bez zmian"
            exit 0
          fi

          git commit -m "Update master cache [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*3))
          done

      - name: Upload master cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bip-master-cache
          retention-days: 30
          path: |
            data/cache.json
            data/cache.zip

      - name: Send results email
        if: always()
        shell: bash
        env:
          GMAIL_USER: "kamiljelonek227@gmail.com"
          GMAIL_APP_PASSWORD: "sldy dhtk redc vwrn"
        run: |
          python3 - <<'PY'
          import os, json, glob, gzip, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime, timezone
          from pathlib import Path
          from collections import defaultdict

          GMAIL_USER         = os.environ.get("GMAIL_USER", "")
          GMAIL_APP_PASSWORD = os.environ.get("GMAIL_APP_PASSWORD", "")

          if not GMAIL_APP_PASSWORD:
              print("⚠️ Brak GMAIL_APP_PASSWORD — email pominięty")
              exit(0)

          SHARDS      = Path("cache-store/shards")
          shard_files = sorted(glob.glob(str(SHARDS / "cache_shard_*.json.gz")))
          now_utc     = datetime.now(timezone.utc)

          CUTOFF_H = 23

          results   = defaultdict(lambda: {"nowe": [], "zmiana": []})
          seen_urls = set()
          shards_ok = 0

          for sf in shard_files:
              try:
                  with gzip.open(sf, "rt", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"⚠️ {sf}: {e}")
                  continue
              shards_ok += 1

              for key, meta in data.get("content_seen", {}).items():
                  if not isinstance(meta, dict):
                      continue
                  status = meta.get("status", "")
                  if status not in ("NOWE", "ZMIANA"):
                      continue
                  if status == "NOWE":
                      checked_str = meta.get("found_at") or meta.get("last_checked", "")
                  else:
                      checked_str = meta.get("last_checked") or meta.get("found_at", "")
                  if checked_str:
                      try:
                          fa = datetime.fromisoformat(checked_str.replace("Z", "+00:00"))
                          if fa.tzinfo is None:
                              fa = fa.replace(tzinfo=timezone.utc)
                          if (now_utc - fa).total_seconds() / 3600 > CUTOFF_H:
                              continue
                      except Exception:
                          pass

                  gmina  = meta.get("gmina") or "nieznana"
                  url    = meta.get("url") or key
                  title  = (meta.get("title") or "").strip() or "(brak tytułu)"
                  kws    = meta.get("keywords") or []
                  kw_str = ", ".join(kws[:5]) if isinstance(kws, list) else str(kws)

                  if url in seen_urls:
                      continue
                  seen_urls.add(url)

                  if status == "NOWE":
                      results[gmina]["nowe"].append((title, url, kw_str))
                  else:
                      results[gmina]["zmiana"].append((title, url, kw_str))

          total_nowe   = sum(len(v["nowe"])   for v in results.values())
          total_zmiana = sum(len(v["zmiana"]) for v in results.values())
          run_date     = now_utc.strftime("%Y-%m-%d %H:%M UTC")

          print(f"📊 Shardów: {shards_ok}/{len(shard_files)}, NOWE: {total_nowe}, ZMIANA: {total_zmiana}")

          if total_nowe == 0 and total_zmiana == 0:
              subject = f"BIP Watcher {now_utc.strftime('%Y-%m-%d')} — brak nowych wyników"
              body_lines = [
                  f"BIP Watcher — skan {run_date}",
                  f"Shardów: {shards_ok}/{len(shard_files)}",
                  "",
                  "Brak nowych ogłoszeń ani zmian załączników.",
              ]
          else:
              subject = (f"BIP Watcher {now_utc.strftime('%Y-%m-%d')} "
                         f"— {total_nowe} NOWYCH, {total_zmiana} ZMIAN")
              body_lines = [
                  f"BIP Watcher — skan {run_date}",
                  f"Shardów: {shards_ok}/{len(shard_files)}",
                  f"Łącznie: {total_nowe} nowych | {total_zmiana} zmian załączników",
                  "=" * 65,
              ]
              for gmina in sorted(results.keys()):
                  v = results[gmina]
                  if not v["nowe"] and not v["zmiana"]:
                      continue
                  body_lines.append(f"\n📍 {gmina}")
                  if v["nowe"]:
                      body_lines.append(f"  🟢 NOWE ({len(v['nowe'])}):")
                      for title, url, kw in v["nowe"][:100]:
                          body_lines.append(f"    • {title}")
                          body_lines.append(f"      {url}")
                          if kw:
                              body_lines.append(f"      [{kw}]")
                  if v["zmiana"]:
                      body_lines.append(f"  🔄 ZMIANA ZAŁĄCZNIKÓW ({len(v['zmiana'])}):")
                      for title, url, kw in v["zmiana"][:100]:
                          body_lines.append(f"    • {title}")
                          body_lines.append(f"      {url}")
                          if kw:
                              body_lines.append(f"      [{kw}]")

          body = "\n".join(body_lines)
          try:
              msg = MIMEMultipart("alternative")
              msg["Subject"] = subject
              msg["From"]    = GMAIL_USER
              msg["To"]      = "planowanie@wpd-polska.pl"
              msg.attach(MIMEText(body, "plain", "utf-8"))
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as srv:
                  srv.login(GMAIL_USER, GMAIL_APP_PASSWORD)
                  srv.sendmail(GMAIL_USER, ["planowanie@wpd-polska.pl"], msg.as_string())
              print(f"✅ Email wysłany: {subject}")
          except Exception as e:
              print(f"❌ Błąd emaila: {e}")
              raise
          PY


  # ============================================================
  # KROK 5: Fallback email — odpala się TYLKO gdy merge nie wyszedł
  # Czyta hits_backup_*.jsonl z cache-store zamiast content_seen
  # ============================================================
  email_fallback:
    name: Email fallback (gdy merge padł)
    runs-on: ubuntu-latest
    needs: [merge]
    if: always() && needs.merge.result != 'success'
    timeout-minutes: 10
    concurrency:
      group: bip-watcher-email-fallback
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: cache-store
          path: cache-store
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send fallback email from hits_backup
        shell: bash
        env:
          GMAIL_USER: "kamiljelonek227@gmail.com"
          GMAIL_APP_PASSWORD: "sldy dhtk redc vwrn"
          MERGE_RESULT: ${{ needs.merge.result }}
        run: |
          python3 - <<'PY'
          import os, json, glob, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime, timezone
          from pathlib import Path

          GMAIL_USER         = os.environ.get("GMAIL_USER", "")
          GMAIL_APP_PASSWORD = os.environ.get("GMAIL_APP_PASSWORD", "")
          MERGE_RESULT       = os.environ.get("MERGE_RESULT", "unknown")

          if not GMAIL_APP_PASSWORD:
              print("⚠️ Brak GMAIL_APP_PASSWORD — email pominięty")
              exit(0)

          now_utc   = datetime.now(timezone.utc)
          run_date  = now_utc.strftime("%Y-%m-%d %H:%M UTC")
          CUTOFF_H  = 23

          # Zbierz wpisy z hits_backup_*.jsonl z ostatnich CUTOFF_H godzin
          backup_files = sorted(glob.glob("cache-store/hits_backup_*.jsonl"))
          print(f"📂 Znaleziono {len(backup_files)} plików hits_backup")

          items = []
          seen = set()
          for bf in backup_files:
              try:
                  with open(bf, encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              obj = json.loads(line)
                              ts_str = obj.get("ts", "")
                              item   = obj.get("item", "")
                              if not item or item in seen:
                                  continue
                              # Filtruj po czasie
                              if ts_str:
                                  try:
                                      ts = datetime.fromisoformat(ts_str)
                                      if ts.tzinfo is None:
                                          ts = ts.replace(tzinfo=timezone.utc)
                                      if (now_utc - ts).total_seconds() / 3600 > CUTOFF_H:
                                          continue
                                  except Exception:
                                      pass
                              seen.add(item)
                              items.append(item)
                          except Exception:
                              continue
              except Exception as e:
                  print(f"⚠️ {bf}: {e}")

          print(f"📊 Znaleziono {len(items)} wpisów z ostatnich {CUTOFF_H}h")

          run_date_short = now_utc.strftime("%Y-%m-%d")
          if not items:
              subject = f"BIP Watcher {run_date_short} — FALLBACK — brak nowych wyników (merge: {MERGE_RESULT})"
              body = f"BIP Watcher — skan {run_date}\nMerge job: {MERGE_RESULT}\n\nBrak nowych ogłoszeń w hits_backup."
          else:
              subject = f"BIP Watcher {run_date_short} — FALLBACK — {len(items)} wyników (merge: {MERGE_RESULT})"
              body = (
                  f"BIP Watcher — skan {run_date}\n"
                  f"Merge job: {MERGE_RESULT}\n"
                  f"Wyniki z hits_backup ({len(items)} wpisów):\n"
                  + "=" * 65 + "\n\n"
                  + "\n".join(items[:1200])
              )
              if len(items) > 1200:
                  body += f"\n\n... truncated ({len(items)} total)"

          try:
              msg = MIMEMultipart("alternative")
              msg["Subject"] = subject
              msg["From"]    = GMAIL_USER
              msg["To"]      = "planowanie@wpd-polska.pl"
              msg.attach(MIMEText(body, "plain", "utf-8"))
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as srv:
                  srv.login(GMAIL_USER, GMAIL_APP_PASSWORD)
                  srv.sendmail(GMAIL_USER, ["planowanie@wpd-polska.pl"], msg.as_string())
              print(f"✅ Fallback email wysłany: {subject}")
          except Exception as e:
              print(f"❌ Błąd fallback emaila: {e}")
              raise
